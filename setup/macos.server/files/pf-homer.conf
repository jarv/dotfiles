# /etc/pf.anchors/homer
# Drop all inbound on physical interfaces except Tailscale's UDP port and
# mDNS/DHCP; allow everything on the tailscale (utun) interface and loopback.
#
# Add to /etc/pf.conf (after the existing anchors):
#   anchor "homer"
#   load anchor "homer" from "/etc/pf.anchors/homer"
# Then: sudo pfctl -f /etc/pf.conf && sudo pfctl -e

phys = "{ en0 en1 en2 en3 en4 en5 en6 en7 en8 bridge0 }"

set skip on lo0
set skip on utun

block in on $phys
pass out on $phys keep state

pass in on $phys proto udp to port 41641          # tailscale direct connections
pass in on $phys proto udp from any port 67 to port 68   # dhcp
pass in on $phys proto udp to port 5353           # mdns / bonjour
pass in on $phys inet proto icmp icmp-type echoreq
pass in on $phys inet6 proto icmp6

# Uncomment to allow ssh from LAN as a fallback while setting up:
# pass in on $phys proto tcp to port 22
